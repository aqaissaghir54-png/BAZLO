name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Find and Build APK
        run: |
          # Find the directory containing settings.gradle or build.gradle
          TARGET_DIR=$(dirname $(find . -maxdepth 3 -name "settings.gradle*" -o -name "build.gradle*" | head -n 1))
          echo "Building in directory: $TARGET_DIR"
          cd "$TARGET_DIR"
          gradle assembleDebug --stacktrace
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/debug/*.apk"
          
